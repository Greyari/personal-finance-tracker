name: personal_finance_app
description: RERO - Personal Finance & Couple App
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # State management
  flutter_riverpod: ^2.5.1

  # Utilities & UI Packages
  intl: ^0.19.0
  equatable: ^2.0.5
  shared_preferences: ^2.5.6
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  fl_chart: ^1.3.0
  shimmer: ^3.0.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  lottie: ^3.1.2
  firebase_messaging: ^15.2.10
  dart_jsonwebtoken: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  # Prevents path_provider_foundation 2.6.0 native asset build hook bug on Windows paths with spaces
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/goals/
    - assets/images/backgrounds/
    - assets/lottie/
